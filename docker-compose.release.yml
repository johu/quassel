services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quassel}
      POSTGRES_USER: ${POSTGRES_USER:-quassel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  quasselcore:
    image: ${QUASSEL_IMAGE:-ghcr.io/quassel/quasselcore:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${QUASSEL_PORT:-4242}:4242"
    environment:
      DB_BACKEND: PostgreSQL
      AUTH_AUTHENTICATOR: Database
      DB_PGSQL_USERNAME: ${POSTGRES_USER:-quassel}
      DB_PGSQL_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_PGSQL_HOSTNAME: postgres
      DB_PGSQL_PORT: 5432
      DB_PGSQL_DATABASE: ${POSTGRES_DB:-quassel}
      QUASSEL_CONFIGDIR: /var/lib/quassel
    volumes:
      - ./docker-data/quassel:/var/lib/quassel
